name: Icon request
description: Request a new icon for the library
title: "icon: "
labels: ["icon request"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: search the existing issues for the concept — it may already
        have been requested under a different name.

  - type: input
    id: name
    attributes:
      label: Proposed name
      description: kebab-case. Name the shape, not the meaning.
      placeholder: calendar-check
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Suggested category
      description: Optional. The 2.0 categories have not been defined yet.
    validations:
      required: false

  - type: textarea
    id: use-case
    attributes:
      label: What do you need it for?
      description: Which product and surface. Concrete use cases keep the set from sprawling.
    validations:
      required: true

  - type: textarea
    id: tags
    attributes:
      label: Search terms
      description: Words someone would type to find this icon.
      placeholder: schedule, confirmed, booking, appointment
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: Visual reference
      description: |
        Describe the glyph, or attach a sketch. Please do **not** attach an SVG
        from another icon library — this set is original artwork.

  - type: dropdown
    id: mirror
    attributes:
      label: Does it have a horizontal direction?
      description: If yes it must mirror under dir="rtl". Vertical direction does not count.
      options:
        - "No"
        - "Yes — points left or right"
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I checked this icon does not already exist under another name or alias
          required: true
        - label: I am not asking for a glyph copied from another icon library
          required: true
