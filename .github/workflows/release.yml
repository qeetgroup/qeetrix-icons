name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    runs-on: ubuntu-latest
    # A protected environment gates publishing. Until it exists and holds
    # NPM_TOKEN, this workflow opens a version PR and never publishes.
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: ${{ vars.QEETRIX_NPM_REGISTRY || 'https://registry.npmjs.org' }}
          scope: "@qeetrix"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: version or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bunx changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
