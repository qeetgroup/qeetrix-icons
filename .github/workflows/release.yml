name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  # Not gated on the publish environment: versioning must work whether or not
  # publishing is configured.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # Do not add a `publish:` input here. It makes the action publish on every
      # push to main, which fails with ENEEDAUTH without credentials. Publishing
      # is the gated job below.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: version
    # A pending version PR means changesets are unconsumed, so the version on
    # main is not the one to release.
    if: needs.version.outputs.pending != 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          # npm 11, required for trusted publishing. Node 20 ships npm 10.
          node-version: 24
          registry-url: ${{ vars.QEETRIX_NPM_REGISTRY || 'https://registry.npmjs.org' }}
          scope: "@qeetrix"
      - run: bun install --frozen-lockfile

      # Secrets are unavailable in a step-level `if`, so reduce the decision to
      # a boolean output. Evaluates to "true"/"false" and never prints the token.
      - id: creds
        name: check for publish credentials
        run: |
          echo "ready=${{ secrets.NPM_TOKEN != '' || vars.QEETRIX_NPM_TRUSTED_PUBLISHING == 'true' }}" >> "$GITHUB_OUTPUT"

      # Succeeds rather than fails: an unpublished package is a legitimate
      # state, and a permanently red workflow gets ignored.
      - if: steps.creds.outputs.ready != 'true'
        name: report that publishing is not configured
        run: |
          {
            echo "## Publishing skipped"
            echo
            echo "Versioning ran. Nothing was published because this repository cannot"
            echo "authenticate to the registry."
            echo
            echo "Add an \`NPM_TOKEN\` secret with publish rights to the \`@qeetrix\` scope,"
            echo "or enable trusted publishing and set \`QEETRIX_NPM_TRUSTED_PUBLISHING=true\`."
            echo "See \`docs/releases.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Publishing skipped::No NPM_TOKEN and trusted publishing not enabled. See the job summary."

      - if: steps.creds.outputs.ready == 'true'
        name: build and publish
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
