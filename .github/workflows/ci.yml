name: CI

on:
  # On develop only: every push to it, and every pull request into it (Dependabot's). A develop → main pull request
  # is checked by develop's run on the same commit, and main isn't checked again after the merge: main requires
  # this check on an up-to-date branch, so what's merged is exactly what passed here.
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # By hand, on any branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # No known advisory in the dependencies, development tooling included.
      - run: bun audit
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:icons
      - run: bun run check:filled
      - run: bun run check:sharp
      - run: bun run check:generated
      - run: bun run check:brands
      - run: bun run check:logos
      - run: bun run build
      - run: bun run playground:build
