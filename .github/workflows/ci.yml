name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: validate icons
        run: bun run validate

      # Must precede `build`: build runs the generator, so checking afterwards
      # would overwrite a hand-edited generated file instead of reporting it.
      - name: check generated output is committed
        run: bun run generate:check

      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint

      # Must precede `test`: the explorer tests read .explorer/index.html and
      # skip when it is absent.
      - name: build the icon explorer
        run: bun run explorer

      # Several suites skip when an artifact they need is missing, so a
      # step-ordering mistake surfaces as a green run that tested nothing.
      - name: test
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/test.log
          if grep -qE '[0-9]+ skipped' /tmp/test.log; then
            echo "::error::Tests were skipped, which means an artifact they need was missing."
            grep -E 'skipped' /tmp/test.log
            exit 1
          fi

      - name: check the icon catalogue is current
        run: bun run catalog:check
      - name: check the API reference is current
        run: bun run api:check

      # Advisory: duplicate semantics and family gaps are judgement calls.
      # Do not make this fail the build.
      - name: catalogue health report
        run: bun run doctor

  # Separate job because packing, installing and bundling takes longer than
  # everything above combined.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: verify the published package
        run: bun run verify:package
