name: CI

# Verify, once per change: on every pull request into develop (Dependabot's, a contributor's) and on the
# develop → main pull request, which is what main takes. Pushes run nothing, so no commit is checked twice.
#
# Verify is the quick gate: install, types, Biome (format and lint), the generated components against their sources,
# and a dependency audit. The tests, the icon, filled, sharp, brand and logo checks, the build and the playground
# build run locally before pushing (docs/contributing.md, "Before you push"); the release builds the package again
# before it publishes.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: format and lint (Biome)
        run: bun run lint
      - name: generated components match their sources
        run: bun run check:generated
      - name: dependency audit
        run: bun audit
