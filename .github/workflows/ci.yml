name: CI

on:
  # Once, on the pull request. A merge into main isn't checked again: main requires this check and an up-to-date
  # branch, so a merge lands exactly what its pull request tested.
  pull_request:
  # The Version workflow starts it on the commit it bumps, which GitHub holds as a pull_request run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # No known advisory in the dependencies, development tooling included.
      - run: bun audit
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:icons
      - run: bun run check:filled
      - run: bun run check:sharp
      - run: bun run check:generated
      - run: bun run check:brands
      - run: bun run check:logos
      - run: bun run build
      - run: bun run playground:build
