name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  # Everything that only needs the repository. Fast, and the job a reviewer
  # actually waits on.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # Cheapest check first: a malformed SVG fails here rather than surfacing
      # as a confusing TypeScript error after generation.
      - name: validate icons
        run: bun run validate

      # Before `build`, deliberately. `build` runs the generator itself, so
      # checking afterwards would silently overwrite hand-edited generated
      # files instead of reporting them.
      - name: check generated output is committed
        run: bun run generate:check

      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint

      # Before `test`, and that ordering is load-bearing: the explorer's
      # behaviour and accessibility tests load the generated .explorer/index.html
      # and skip when it is absent. With this step after `test`, all 40 of them
      # silently skipped on a clean checkout — green CI that verified nothing.
      - name: build the icon explorer
        run: bun run explorer

      # Visual-regression snapshots, the explorer's behaviour and accessibility
      # tests, and the tree-shaking check against the real dist/.
      #
      # A skipped suite is not a passing suite: several suites guard on an
      # artifact existing (dist/, .explorer/) and skip when it does not, so a
      # step-ordering mistake shows up as green CI that verified nothing. That
      # is exactly what happened before the explorer step moved above this one,
      # so the skip count is checked rather than trusted to a comment.
      - name: test
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/test.log
          if grep -qE '[0-9]+ skipped' /tmp/test.log; then
            echo "::error::Tests were skipped, which means an artifact they need was missing."
            grep -E 'skipped' /tmp/test.log
            exit 1
          fi

      # Both are generated, so both can go stale like any tracked artifact.
      - name: check the icon catalogue is current
        run: bun run catalog:check
      - name: check the API reference is current
        run: bun run api:check

      # Advisory by design: duplicate semantics and family gaps are judgement
      # calls, so this reports on every PR without failing the build. A check
      # that blocked merges over a naming opinion would just get disabled.
      - name: catalogue health report
        run: bun run doctor

  # Separate job: packing, installing into a throwaway consumer and bundling
  # takes far longer than the rest of the suite combined, and it fails for
  # different reasons. Keeping it apart means a reviewer can see the fast
  # signal without waiting for it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Packs the real tarball, asserts its contents, installs it into a
      # throwaway project outside the source tree, typechecks that consumer
      # against the shipped declarations with skipLibCheck off, server-renders
      # to prove runtime, then measures tree-shaking and size against a
      # committed baseline.
      - name: verify the published package
        run: bun run verify:package
