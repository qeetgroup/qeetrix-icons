name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # Before `build`, which runs the generator: checking afterwards would
      # overwrite a hand-edited component instead of reporting it.
      - name: components match their source SVGs
        run: bun run generate:check

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
