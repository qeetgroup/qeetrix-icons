name: Main takes develop

# main takes changes from develop only. A pull request into main from any other branch (a feature branch, a fork,
# Dependabot) fails this check, which main requires: feature branches go into develop, and develop goes into main.
on:
  pull_request:
    branches: [main]
    # edited: a pull request whose base is changed to main is checked again.
    types: [opened, reopened, synchronize, edited]
  # By hand: on develop it passes, on any other branch it fails.
  workflow_dispatch:

permissions: {}

jobs:
  source:
    name: Source branch is develop
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The change comes from this repository's develop
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            source="$HEAD_REPO:$HEAD_REF"
          else
            source="$GITHUB_REPOSITORY:$REF_NAME"
          fi
          if [ "$source" != "$GITHUB_REPOSITORY:develop" ]; then
            echo "::error::main takes develop only, and this comes from $source. Open the pull request into develop."
            exit 1
          fi
          echo "From develop: main takes it."
