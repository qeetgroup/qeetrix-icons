name: Version

# Bumps the patch version on the PR branch, so the version you are releasing is
# visible in the PR diff and reviewable like any other change.
#
# Want a minor or major bump instead? Edit `version` in package.json yourself.
# This workflow only acts when the PR's version is still equal to main's, so a
# manual bump is left alone rather than bumped a second time.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: version-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # A fork PR gets a read-only token and cannot be pushed to, and a bot's own
    # commit must not trigger another bump.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      actions: write # start CI on the bumped commit (the last step)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: bump the patch version unless it is already raised
        id: bump
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          current=$(node -p "require('./package.json').version")
          base=$(git show "origin/$BASE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")

          echo "PR version: $current"
          echo "$BASE version: $base"

          if [ "$current" != "$base" ]; then
            echo "Version already raised in this PR. Leaving it alone."
            exit 0
          fi

          next=$(node -e "
            const [maj, min, patch] = '$base'.split('.').map(Number);
            console.log([maj, min, patch + 1].join('.'));
          ")
          echo "Bumping $current -> $next"

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$next';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to $next"
          git push origin "HEAD:$HEAD_REF"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # A commit pushed with this workflow's token starts no workflow (GitHub holds its pull_request run), so
      # the bumped commit would have no CI result. A run started explicitly isn't held: start CI on it, as
      # qeetrix-react's Version workflow does.
      - name: run CI on the bumped commit
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          gh workflow run ci.yml --ref "$HEAD_REF" --repo "$GITHUB_REPOSITORY"
          gh workflow run main-takes-develop.yml --ref "$HEAD_REF" --repo "$GITHUB_REPOSITORY"
