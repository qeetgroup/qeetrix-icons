name: Version

# A develop → main pull request releases, so the version it carries must be above main's. Raise `version` in
# package.json on develop, in an ordinary commit, before opening the pull request; for a minor or major, raise it by
# hand the same way. This check fails, naming the next patch, until it's raised; a pull request that changes nothing
# that ships (CI, docs, tests) needs no new version, and merging it releases nothing. Nothing commits for you: main
# requires CI on the pull request's last commit, and a commit pushed by a workflow gets no CI run of its own.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  raised:
    name: Version is raised
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The version is above main's
        env:
          BASE: ${{ github.base_ref }}
          PKG: package.json
          NPM_REGISTRY: ${{ vars.QEETRIX_NPM_REGISTRY }}
          # Paths that don't ship: a pull request touching only these needs no new version.
          NO_SHIP: '^(\.github/|docs/|tests/)|(^|/)[^/]*\.md$'
        run: |
          set -euo pipefail
          current=$(node -p "require('./$PKG').version")
          if ! base_package=$(git show "origin/$BASE:$PKG" 2>/dev/null); then
            echo "$BASE has no $PKG yet: $current is the first release."; exit 0
          fi
          base=$(printf '%s' "$base_package" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "This pull request: $current. $BASE: $base."
          above=$(node -p "const p = v => v.split('-')[0].split('.').map(Number); const [a, b] = [p('$current'), p('$base')];
            (a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) > 0")
          if [ "$above" != "true" ]; then
            ships=$(git diff --name-only "origin/$BASE...HEAD" | grep -v -E "$NO_SHIP" || true)
            if [ -z "$ships" ]; then
              echo "This pull request changes nothing that ships: no new version, and nothing to release."; exit 0
            fi
            # The next patch npm has never accepted (an unpublished version can never be published again).
            if [ -f scripts/npm-versions.mjs ]; then next=$(node scripts/npm-versions.mjs next "$base"); else
              next=$(node -p "const [a, b, c] = '$base'.split('.').map(Number); [a, b, c + 1].join('.')"); fi
            echo "::error::Raise version in $PKG above $base on develop, in an ordinary commit: $next for a patch, or a minor or major by hand."
            exit 1
          fi
